evaluation:
  split: "validation"
  metrics: ["Accuracy", "F1_macro", "F2_macro", "Precision_macro", "Recall_macro"]
  ordinal_metrics: ["MAE", "off_by_one_accuracy"]
  aggregation_method: "mean"

