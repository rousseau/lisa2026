run_id: "0004"
run_name: "task1b_unet_selfsuper_baseline"
date: "2026-05-15"
description: >
  Self-supervised denoising baseline for Task 1b. 3D BasicUNet trained to
  reconstruct clean images from synthetically degraded inputs (Gaussian noise).
  No paired data required. Evaluated with PSNR, LPIPS, FID on 2D axial slices.

# ── snapshot of configs/run_0004_task1b_unet.yaml at implementation time ────

data:
  data_root: "/home/rousseau/Data/LISA2026"
  split_pkl: "results/splits/task1a_fixed.pkl"
  image_suffix: "_ciso.nii.gz"
  spatial_size: [96, 96, 96]
  noise_std_min: 0.05
  noise_std_max: 0.20

model:
  in_channels: 1
  out_channels: 1
  features: [16, 32, 64, 128, 256, 16] # 6 values required by MONAI BasicUNet

training:
  batch_size: 2
  num_workers: 4
  num_epochs: 80
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  loss:
    l1_weight: 1.0
    ssim_weight: 1.0

early_stopping:
  patience: 15

inference:
  fid_num_slices_per_volume: 10

environment:
  seed: 42
  deterministic: true
  mixed_precision: true

output:
  checkpoint_dir: "outputs/checkpoints/RUN_0004"
  log_dir: "outputs/logs/RUN_0004"
  results_dir: "results/runs/RUN_0004"

# ── environment at implementation time ──────────────────────────────────────
# These values are filled in when the run is actually executed.
execution_environment:
  python: "pending"
  pytorch: "2.11.0+cu130" # expected – from conda lisa2026
  torchvision: "0.26.0+cu130" # expected
  monai: "pending"
  lpips: "0.1.4" # expected
  cuda: "pending"
  gpu: "pending"
  hostname: "pending"
