# RUN_0005 v2 — Multi-task nnU-Net-like Architecture (revised 2026-06-15)
#
# Revisions from v1:
#   1. Optimizer: AdamW -> SGD + momentum 0.99 + Nesterov + PolyLR schedule
#   2. Deep supervision enabled (5-level, weighted)
#   3. Epochs: 100 -> 1000, patience: 20 -> 200
#   4. class-weighted CE for Task 1a
#   5. Single-GPU H100 on Jean Zay (no DDP)

run_id: "0005"
run_name: "multitask_nnunet_like_v2"
date: "2026-06-15"
description: >
  Shared 6-stage 3D U-Net encoder with three task-specific heads.
  nnU-Net v2 auto-configuration recipe: SGD + PolyLR, deep supervision,
  1000 epochs, class-weighted T1a.

run:
  task: multitask

# ── Data ───────────────────────────────────────────────────────────────────
data:
  data_root: "${LISA_DATA_ROOT}"
  bids_root: "${LISA_DATA_ROOT}"
  csv_path: "${LISA_DATA_ROOT}/LISA_Task1a_2026.csv"
  split_pkl_1a: "results/splits/task1a_fixed.pkl"
  split_pkl_2: "results/splits/task2_fixed.pkl"
  image_suffix: "_ciso.nii.gz"
  label_suffix: "_LF_seg.nii.gz"
  patch_size: [128, 128, 128]
  val_roi_size: [128, 128, 128]
  train_num_samples: 2

# ── Model (nnU-Net-like) ───────────────────────────────────────────────────
model:
  in_channels: 1
  filters: [32, 64, 128, 256, 320, 320]
  num_seg_classes: 12
  num_artifact_tasks: 7
  num_artifact_classes: 3
  deep_supervision: true

# ── Training ────────────────────────────────────────────────────────────────
training:
  batch_size: 1
  num_workers: 4

  num_warmup_epochs: 50
  dice_warmup_target: 0.10
  num_head_warmup_epochs: 0
  num_epochs: 1000

  # SGD + Nesterov (nnU-Net default) replaced AdamW
  optimizer: "sgd"
  learning_rate: 1.0e-2
  min_learning_rate: 1.0e-6
  weight_decay: 3.0e-5
  momentum: 0.99
  nesterov: true

  # PolyLR schedule
  scheduler: "poly"
  poly_power: 0.9

  joint_learning_rate: 5.0e-3
  head_warmup_lr: 5.0e-5
  max_grad_norm: 12.0

  lambda_1a: 0.5
  lambda_1b: 1.0
  lambda_2: 1.0

  loss:
    focal_gamma: 2.0
    focal_weight: 0.5

  # Deep supervision weights (deepest -> shallowest)
  deep_supervision_weights: [0.5, 0.25, 0.125, 0.0625, 0.03125]

  pretrained_checkpoint: ""

early_stopping:
  patience: 200

# ── Inference ───────────────────────────────────────────────────────────────
inference:
  sw_batch_size: 1
  overlap: 0.5
  tta_flip_axes: []
  keep_largest_component: false

# ── Environment ─────────────────────────────────────────────────────────────
environment:
  seed: 42
  deterministic: true
  mixed_precision: true

# ── Output ──────────────────────────────────────────────────────────────────
output:
  checkpoint_dir: "outputs/checkpoints/RUN_0005"
  log_dir: "outputs/logs/RUN_0005"
  results_dir: "results/runs/RUN_0005"
