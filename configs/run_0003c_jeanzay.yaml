# RUN_0003c — Hybrid Fusion nnU-Net + MedSAM2 (Jean Zay config)

run_id: "0003c"
run_name: "task2_hybrid_jeanzay"
task: "2"
date: "2026-06-05"
description: >
  Hybrid model with 2-phase training. Optimized for 4x H100.
  Phase 1: 20 epochs fusion blocks only. Phase 2: 80 epochs full model.

data:
  data_root: "${WORK}/LISA/data"
  split_pkl: "results/splits/task2_fixed.pkl"
  image_suffix: "_ciso.nii.gz"
  label_suffix: "_LF_seg.nii.gz"
  patch_size: [128, 128, 128]
  val_roi_size: [128, 128, 128]
  train_num_samples: 2

model:
  type: "hybrid"
  in_channels: 1
  out_channels: 12
  nnunet_checkpoint: "outputs/checkpoints/RUN_0003a/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_0/checkpoint_best.pth"
  medsam2_checkpoint: "external/MedSAM2/checkpoints/MedSAM2_latest.pt"
  filters: [32, 64, 128, 256, 320]
  deep_supervision: false

training:
  batch_size: 1
  num_workers: 12
  num_epochs: 100
  phase1_epochs: 20
  phase1_lr: 1.0e-3
  phase2_lr: 5.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  loss:
    type: "dice_ce"
    lambda_dice: 1.0
    lambda_ce: 1.0

early_stopping:
  patience: 25

inference:
  sw_batch_size: 2
  overlap: 0.5
  tta_flip_axes:
    - [2]
    - [3]
    - [4]
  keep_largest_component: true

environment:
  seed: 42
  deterministic: true
  mixed_precision: true

output:
  checkpoint_dir: "outputs/checkpoints/RUN_0003c"
  log_dir: "outputs/logs/RUN_0003c"
  results_dir: "results/runs/RUN_0003c"
