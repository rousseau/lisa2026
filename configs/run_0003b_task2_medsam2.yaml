# RUN_0003b — MedSAM2 Encoder + DynUNet Decoder (Task 2)

run_id: "0003b"
run_name: "task2_medsam2_dynunet"
task: "2"
date: "2026-06-05"
description: >
  MedSAM2 frozen image encoder (Hiera ViT) + trainable DynUNet decoder
  for multi-structure 3D segmentation. Fine-tuning only projection + decoder.

data:
  data_root: "/home/rousseau/Data/LISA2026"
  split_pkl: "results/splits/task2_fixed.pkl"
  image_suffix: "_ciso.nii.gz"
  label_suffix: "_LF_seg.nii.gz"
  patch_size: [128, 128, 128]
  val_roi_size: [128, 128, 128]
  train_num_samples: 2

model:
  type: "medsam2"
  in_channels: 1
  out_channels: 12
  medsam2_checkpoint: "external/MedSAM2/checkpoints/MedSAM2_latest.pt"
  medsam2_config: "configs/sam2.1_hiera_t512.yaml"
  decoder_filters: [32, 64, 128, 256, 320]
  deep_supervision: false

training:
  batch_size: 1
  num_workers: 4
  num_epochs: 100
  learning_rate: 5.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  loss:
    type: "dice_ce"
    lambda_dice: 1.0
    lambda_ce: 1.0

early_stopping:
  patience: 25

inference:
  sw_batch_size: 1
  overlap: 0.5
  tta_flip_axes:
    - [2]
    - [3]
    - [4]
  keep_largest_component: true

environment:
  seed: 42
  deterministic: true
  mixed_precision: true

output:
  checkpoint_dir: "outputs/checkpoints/RUN_0003b"
  log_dir: "outputs/logs/RUN_0003b"
  results_dir: "results/runs/RUN_0003b"
