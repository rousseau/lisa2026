# Configuration RUN_0001 - Task 1a (Quality Assessment)

run:
  id: RUN_0001
  task: task1a
  split_id: SPLIT_V1_PATIENT_80_20
  seeds: [17, 23, 42]

data:
  root: /home/rousseau/Data/LISA2026
  dataset_tag: lisa2026_train_v1
  target_size: 96
  val_fraction: 0.2
  patient_level_split: true
  exclude_rules:
    - corrupted_volume
    - missing_volume

model:
  base_channels: 32
  c_anat: 16
  c_mod: 8
  c_art: 8
  n_artifacts: 7
  n_severity: 3
  n_seg_classes: 14
  # Documented intent only; training code uses BackboneLISA.
  name: densenet3d_ordinal_qa
  class_imbalance_strategy:
    use_weighted_sampling: true
    use_focal_ablation: true

training:
  epochs: 100
  batch_size: 2
  num_workers: 4
  save_every: 10
  viz_every: 10
  early_stopping_patience: 15
  lr: 1.0e-4
  weight_decay: 1.0e-5
  lam1a: 1.0
  lam1b: 0.0
  lam2: 0.0
  label_smoothing: 0.1
  ordinal_weight: 0.5
  focal_gamma: 2.0
  focal_alpha: [0.25, 0.5, 1.0]
  ohem_ratio: 0.35
  ohem_anneal: true
  ohem_min_ratio: 0.10
  lr_encoder_scale: 1.0
  augment: true
  simulate_artifacts: false
  augmentation_mode: torchio_full
  scheduler:
    type: cosine
    T_max: 100
  losses:
    primary:
      type: ordinal_emd_rps
      weight: 1.0
    ablations:
      - focal
      - focal_plus_ordinal

augmentation:
  offline_synthetic_artifacts: true
  online:
    flip: true
    noise: true
    intensity: true
    blur: true

evaluation:
  metrics:
    - accuracy
    - f1
    - f2
    - precision
    - recall
  ranking:
    type: weighted_mean
    note: weights follow challenge protocol
  postprocessing:
    bayesian_calibration:
      enabled: false
      report_as_ablation: true
