run_id: "0005"
run_name: "task1b_unet_selfsuper_baseline"
date: "2026-05-15"
description: >
  Self-supervised denoising baseline for Task 1b. 3D BasicUNet trained to
  reconstruct clean images from synthetically degraded inputs (Gaussian noise).
  No paired data required. Evaluated with PSNR, LPIPS, FID on 2D axial slices.

data:
  data_root: "/home/rousseau/Data/LISA2026"
  split_pkl: "results/splits/task1a_fixed.pkl"
  image_suffix: "_ciso.nii.gz"
  spatial_size: [96, 96, 96]
  noise_std_min: 0.05
  noise_std_max: 0.20

model:
  in_channels: 1
  out_channels: 1
  features: [16, 32, 64, 128, 256, 16] # 6 values required by MONAI BasicUNet

training:
  batch_size: 2
  num_workers: 4
  num_epochs: 80
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  loss:
    l1_weight: 1.0
    ssim_weight: 1.0

early_stopping:
  patience: 15

inference:
  fid_num_slices_per_volume: 10

environment:
  seed: 42
  deterministic: true
  mixed_precision: true

output:
  checkpoint_dir: "outputs/checkpoints/RUN_0005"
  log_dir: "outputs/logs/RUN_0005"
  results_dir: "results/runs/RUN_0005"
