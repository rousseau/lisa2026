# RUN_0006 — Multi-task nnU-Net v2 PlainConvUNet (Jean Zay iteration 2026-06-23)
#
# Identique à run_0006_plainconv.yaml mais avec les chemins de données Jean Zay.
# Adaptation au nouveau label mapping Task2 (79 patients HF+LF_seg, permutation).

run_id: "0006"
run_name: "multitask_plainconv_nnunet_v2_iter2"
task: "1a+1b+2"
date: "2026-06-23"
description: >
  PlainConvUNet (nnU-Net v2 backbone) avec Task 1a/1b/2.
  Warm-start depuis checkpoint_best.pth de RUN_0003a.
  Label mapping permuté (Ventricles↔Caudates↔Lentiforms).
  Données Task2 élargies à 79 patients (HF+LF_seg).

run:
  task: multitask

# ── Data ───────────────────────────────────────────────────────────────────
data:
  data_root: "${LISA_DATA_ROOT}"
  bids_root: "${LISA_DATA_ROOT}"
  csv_path: "${LISA_CSV_PATH}"
  split_pkl_1a: "results/splits/task1a_fixed.pkl"
  split_pkl_2: "results/splits/task2_79_fixed.pkl"

  # New directory layout (6 subdirs)
  task2_dir: "${LISA_DATA_ROOT}/Task2"
  task2extra_dir: "${LISA_DATA_ROOT}/Task2Extra"
  task1b_dir: "${LISA_DATA_ROOT}/Task1b"
  task1a_dir: "${LISA_DATA_ROOT}/Task1a"

  image_suffix: "_ciso.nii.gz"
  label_suffix: "_seg.nii.gz"       # HF labels (scored)
  label_suffix_lf: "_LF_seg.nii.gz"  # LF labels (auxiliary)
  patch_size: [112, 160, 128]
  val_roi_size: [112, 160, 128]
  train_num_samples: 2

# ── Model (nnU-Net v2 PlainConvUNet) ───────────────────────────────────────
model:
  type: "plainconv"
  in_channels: 1
  n_stages: 6
  features_per_stage: [32, 64, 128, 256, 320, 320]
  strides: [[1, 1, 1], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2], [1, 2, 2]]
  num_seg_classes: 12
  num_artifact_tasks: 7
  num_artifact_classes: 3
  deep_supervision: true

# ── Training ────────────────────────────────────────────────────────────────
training:
  batch_size: 1
  num_workers: 4

  num_warmup_epochs: 0
  dice_warmup_target: 0.10
  num_head_warmup_epochs: 0
  num_epochs: 1000

  # SGD + Nesterov (nnU-Net default)
  optimizer: "sgd"
  learning_rate: 1.0e-2
  min_learning_rate: 1.0e-6
  weight_decay: 3.0e-5
  momentum: 0.99
  nesterov: true

  # PolyLR schedule
  scheduler: "poly"
  poly_power: 0.9

  joint_learning_rate: 1.0e-3
  head_warmup_lr: 5.0e-5
  max_grad_norm: 12.0
  torch_compile: false

  lambda_1a: 0.1
  lambda_1b: 1.0
  lambda_2: 1.0
  lambda_lf: 0.5  # auxiliary LF supervision weight

  loss:
    focal_gamma: 2.0
    focal_weight: 0.5

  # Deep supervision weights (deepest -> shallowest)
  deep_supervision_weights: [0.5, 0.25, 0.125, 0.0625, 0.03125]

  # Warm-start from nnU-Net v2 checkpoint
  pretrained_checkpoint: "nnUNet_results/Dataset501_LISA2026_Task2/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_0/checkpoint_best.pth"

early_stopping:
  patience: 200

# ── Inference ───────────────────────────────────────────────────────────────
inference:
  sw_batch_size: 1
  overlap: 0.5
  tta_flip_axes: []
  keep_largest_component: true

# ── Environment ─────────────────────────────────────────────────────────────
environment:
  seed: 42
  deterministic: true
  mixed_precision: true

# ── Output ──────────────────────────────────────────────────────────────────
output:
  checkpoint_dir: "outputs/checkpoints/RUN_0006"
  log_dir: "outputs/logs/RUN_0006"
  results_dir: "results/runs/RUN_0006"
