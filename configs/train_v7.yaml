# ──────────────────────────────────────────────────────────────────────────────
# Configuration d'entraînement — LISA 2026  v7
#
# Nouveautés vs v6 :
#   - Augmentation d'artefacts refactorisée dans augmentation.py
#     → paramètres UPF/Sundaresan 2024 exacts (source BRIQA)
#     → z-score avant chaque transform, reconversion [0,1] après
#     → RandomBlur(0.4) post-artefact (approximé sur tout le volume)
#   - augment_geometric (dans augmentation.py) : flip + bruit + scaling
#     (sans plus de banding/zipper sinusoïdaux → évite conflit avec sim UPF)
#
# Usage :
#   python src/train.py --config configs/train_v7.yaml
#   python src/train.py --config configs/train_v7.yaml --debug
# ──────────────────────────────────────────────────────────────────────────────

# ── Données ───────────────────────────────────────────────────────────────────
data:
  root:         /home/rousseau/Data/LISA2026
  target_size:  96
  val_fraction: 0.2

# ── Architecture ──────────────────────────────────────────────────────────────
model:
  base_channels: 32
  c_anat: 16
  c_mod:   8
  c_art:   8
  n_artifacts:   7
  n_severity:    3
  n_seg_classes: 14

# ── Entraînement ──────────────────────────────────────────────────────────────
training:
  epochs:      200
  batch_size:  4
  num_workers: 8
  save_every:  10
  viz_every:   10

  lr:           1.0e-4
  weight_decay: 1.0e-5

  lam1a: 1.0
  lam1b: 1.0
  lam2:  1.0

  label_smoothing: 0.1
  ordinal_weight:  0.5

  # augment_geometric : flip + bruit gaussien + scaling (batch-level)
  augment: true
  # augment_artifact : simulation UPF/Sundaresan 2024 (item-level, __getitem__)
  simulate_artifacts: true

  lr_encoder_scale: 1.0
  early_stopping_patience: 30
  compile: true

  scheduler:
    type:  cosine
    T_max: null

# ── Matériel ──────────────────────────────────────────────────────────────────
device: auto
