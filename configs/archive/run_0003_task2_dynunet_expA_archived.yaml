run_id: "0003A"
run_name: "task2_dynunet_baseline_plus_expA"
date: "2026-05-13"

data:
  data_root: "/home/rousseau/Data/LISA2026"
  split_pkl: "results/splits/task2_fixed.pkl"
  image_suffix: "_ciso.nii.gz"
  label_suffix: "_LF_seg.nii.gz"
  patch_size: [128, 128, 128]
  val_roi_size: [128, 128, 128]
  train_num_samples: 1

model:
  in_channels: 1
  out_channels: 12
  kernel_size:
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
  strides:
    - [1, 1, 1]
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
  upsample_kernel_size:
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
  filters: [48, 96, 192, 384, 512]
  norm_name: "instance"
  deep_supervision: false

training:
  batch_size: 1
  num_workers: 4
  num_epochs: 90
  learning_rate: 2.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  pretrained_checkpoint: ""
  loss:
    type: "dice_focal"
    lambda_dice: 1.0
    lambda_focal: 1.0
    focal_gamma: 2.0

early_stopping:
  patience: 20

inference:
  sw_batch_size: 1
  overlap: 0.5
  tta_flip_axes:
    - [2]
    - [3]
    - [4]
  keep_largest_component: true

environment:
  seed: 42
  deterministic: true
  mixed_precision: true

output:
  checkpoint_dir: "outputs/checkpoints/RUN_0003_EXP_A"
  log_dir: "outputs/logs/RUN_0003_EXP_A"
  results_dir: "results/runs/RUN_0003_EXP_A"
