run_id: "0003S"
run_name: "task2_dynunet_symmetry_aware"
date: "2026-05-13"

data:
  data_root: "/home/rousseau/Data/LISA2026"
  split_pkl: "results/splits/task2_fixed.pkl"
  image_suffix: "_ciso.nii.gz"
  label_suffix: "_LF_seg.nii.gz"
  patch_size: [128, 128, 128]
  val_roi_size: [128, 128, 128]
  train_num_samples: 1
  num_classes: 12

model:
  in_channels: 1
  out_channels: 12
  kernel_size:
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
  strides:
    - [1, 1, 1]
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
  upsample_kernel_size:
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
  filters: [32, 64, 128, 256, 320]
  norm_name: "instance"
  deep_supervision: false

training:
  batch_size: 1
  num_workers: 4
  num_epochs: 35
  learning_rate: 5.0e-5
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  pretrained_checkpoint: "outputs/checkpoints/RUN_0003_EXP_C/task2_dynunet_best.pt"
  symmetry_consistency_weight: 0.05
  symmetry_flip_axes: [2, 3, 4]
  symmetry_channel_pairs:
    - [1, 2]
    - [3, 4]
    - [5, 6]
    - [7, 8]
  loss:
    type: "dice_ce"
    lambda_dice: 1.0
    lambda_ce: 1.0

early_stopping:
  patience: 10

inference:
  sw_batch_size: 1
  overlap: 0.5
  tta_flip_axes: []
  keep_largest_component: false

environment:
  seed: 42
  deterministic: true
  mixed_precision: true

output:
  checkpoint_dir: "outputs/checkpoints/RUN_0003_EXP_SYM"
  log_dir: "outputs/logs/RUN_0003_EXP_SYM"
  results_dir: "results/runs/RUN_0003_EXP_SYM"