# ──────────────────────────────────────────────────────────────────────────────
# Configuration d'entraînement — LISA 2026  v8
#
# Nouveautés vs v7 :
#   - FactorizedProjection : les features partagées sont projetées en 3
#     sous-espaces séparés (z_anat, z_mod, z_art) via Conv3d 1×1
#   - Routing différencié :
#       Task1a ← concat(z_anat, z_art) + bottleneck
#       Task1b ← concat(z_anat, z_mod)
#       Task2  ← z_anat seul
#   - Pénalité d'orthogonalité douce entre z_anat et z_mod/z_art
#   - Régularisation VICReg (variance + covariance) sur chaque sous-espace
#   - Gradient surgery (gradient_surgery: cagrad/none) pour réduire les
#     conflits de gradient inter-tâches
#
# Usage :
#   python src/train.py --config configs/train_v8.yaml
#   python src/train.py --config configs/train_v8.yaml --debug
# ──────────────────────────────────────────────────────────────────────────────

# ── Données ───────────────────────────────────────────────────────────────────
data:
  root:         /home/rousseau/Data/LISA2026
  target_size:  96
  val_fraction: 0.2

# ── Architecture ──────────────────────────────────────────────────────────────
model:
  base_channels: 32
  # Factorisation des features (FactorizedProjection)
  #   base_channels (32) → 3 sous-espaces
  c_anat: 16   # anatomique / structurel  (Task2 seul)
  c_mod:   8   # apparence / modalité     (Task1b)
  c_art:   8   # artefacts                (Task1a)
  n_artifacts:   7
  n_severity:    3
  n_seg_classes: 14

# ── Entraînement ──────────────────────────────────────────────────────────────
training:
  epochs:      200
  batch_size:  4
  num_workers: 8
  save_every:  10
  viz_every:   10

  lr:           1.0e-4
  weight_decay: 1.0e-5

  lam1a: 1.0
  lam1b: 1.0
  lam2:  1.0

  label_smoothing: 0.1
  ordinal_weight:  0.5

  # Augmentation
  augment: true
  simulate_artifacts: true
  # Modes : torchio_full | tsinghua_simple | none
  augmentation_mode: none

  # ── Régularisation de factorisation ───────────────────────────────────────
  # lam_orth   : poids de la contrainte d'orthogonalité (0 = désactivé)
  #   Recommandé : 0.01 – 0.05 (démarrer bas, surveiller loss_orth)
  lam_orth:   0.02

  # lam_vicreg : poids de la régularisation VICReg (var + cov)
  #   Recommandé : 0.1 – 0.5 (évite le collapse des sous-espaces)
  lam_vicreg: 0.2

  # ── Gradient surgery ──────────────────────────────────────────────────────
  # none   : backward standard sur la loss totale
  # cagrad : CAGrad (Liu et al. 2021) — gestion coopérative des conflits
  gradient_surgery: none   # démarrer sans, activer si conflits observés

  lr_encoder_scale: 1.0
  early_stopping_patience: 30
  compile: false   # torch.compile bloque sur Triton pour les U-Net 3D (opérateurs complexes FFT)

  scheduler:
    type:  cosine
    T_max: null

# ── Matériel ──────────────────────────────────────────────────────────────────
device: auto
